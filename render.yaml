services:
  - type: web
    name: upsc-pyq-rag-demo
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python app/ingest_study_material.py"
    startCommand: "python app/web.py --host 0.0.0.0 --port $PORT"
    healthCheckPath: /
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
